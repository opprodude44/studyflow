<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyFlow</title>
<meta name="description" content="StudyFlow plans your study around your life: tests, deadlines, activities and how you learn best.">
<meta name="theme-color" content="#100E15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyFlow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: "night desk". Left rail nav (bottom bar on phones), a lamp-lit Today strip, then the selected view. Dark-first. */
:root{
  --bg:#100E15; --panel:#17141F; --raised:#211C2B; --line:#2D2839; --ink:#F2EEF8; --ink-2:#ACA4BB; --ink-3:#7A7289;
  --lamp:#FFB648; --lamp-ink:#261600; --lamp-glow:rgba(255,182,72,.16);
  --mint:#5FDFB4; --rose:#FF7D8C; --sky:#86B6FF;
  --bs:42%; --bl:23%; --bbs:85%; --bbl:66%; --bts:75%; --btl:90%;
  --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F5F3F8; --panel:#FFFFFF; --raised:#EFECF4; --line:#E1DCE9; --ink:#1B1724; --ink-2:#5C556E; --ink-3:#8B839C;
  --lamp:#B35A00; --lamp-ink:#FFFFFF; --lamp-glow:rgba(230,140,20,.14);
  --mint:#0B8660; --rose:#C42F48; --sky:#2B62CC;
  --bs:75%; --bl:91%; --bbs:62%; --bbl:47%; --bts:55%; --btl:23%;
  --shadow:0 18px 40px -20px rgba(40,30,60,.35); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F5F3F8; --panel:#FFFFFF; --raised:#EFECF4; --line:#E1DCE9; --ink:#1B1724; --ink-2:#5C556E; --ink-3:#8B839C;
  --lamp:#B35A00; --lamp-ink:#FFFFFF; --lamp-glow:rgba(230,140,20,.14);
  --mint:#0B8660; --rose:#C42F48; --sky:#2B62CC;
  --bs:75%; --bl:91%; --bbs:62%; --bbl:47%; --bts:55%; --btl:23%;
  --shadow:0 18px 40px -20px rgba(40,30,60,.35); color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-2)}
p{margin:0}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
nav.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--panel)}
.logo{font-family:var(--f-display);font-size:19px;font-weight:700;padding:4px 10px 18px;display:flex;align-items:center;gap:9px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--lamp);box-shadow:0 0 18px 4px var(--lamp-glow),0 0 0 4px var(--lamp-glow)}
.navb{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink-2);font-weight:500}
.navb svg{width:18px;height:18px;flex:0 0 auto}
.navb:hover{background:var(--raised);color:var(--ink)}
.navb[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:inset 3px 0 0 var(--lamp)}
.rail .spacer{flex:1}
.rail .me{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--raised);font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--lamp);color:var(--lamp-ink);font-family:var(--f-display);font-size:13px;flex:0 0 auto}

.view{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:22px 60px;display:flex;flex-direction:column;gap:20px;min-width:0;max-width:1400px;width:100%}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:25;gap:2px}
  .logo,.rail .spacer,.rail .me{display:none}
  .navb{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;flex:1;align-items:center}
  .navb[aria-current="page"]{box-shadow:inset 0 2px 0 var(--lamp)}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:110px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.btn.icon{padding:8px;width:36px;height:36px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:15px}

.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h1{font-size:clamp(22px,3.2vw,32px)}
.hello h1 em{font-style:normal;color:var(--lamp)}
.strip{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1180px){.strip{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.strip .now{grid-column:1/-1}}
@media (max-width:640px){.strip{grid-template-columns:minmax(0,1fr)}}
.quizc .what{font-family:var(--f-display);font-size:18px;line-height:1.2}
.now{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,var(--lamp-glow),transparent 60%),var(--panel)}
.now .what{font-family:var(--f-display);font-size:clamp(20px,2.4vw,26px);line-height:1.15}
.now .when{font-family:var(--f-mono);font-size:13px;color:var(--lamp)}
.energy .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.energy button{border:1px solid var(--line);background:var(--raised);border-radius:14px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:500}
.energy button[aria-pressed="true"]{border-color:var(--lamp);box-shadow:inset 0 0 0 1px var(--lamp);color:var(--ink)}
.bat{width:26px;height:13px;border:2px solid currentColor;border-radius:3px;position:relative;display:block}
.bat::after{content:"";position:absolute;right:-5px;top:2px;width:3px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.bat b{position:absolute;left:1px;top:1px;bottom:1px;border-radius:1px;background:currentColor}
.quick{display:flex;gap:8px;min-width:0}
.quick input{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.quick input:focus{border-color:var(--lamp);outline:none}

.tt{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.tt-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.tt-head h2{font-size:18px}
.pager{display:flex;align-items:center;gap:6px}
.daytabs{display:none;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
.daytabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:6px 10px;cursor:pointer;text-align:center;line-height:1.2;font-size:12px;color:var(--ink-2)}
.daytabs button b{display:block;font-family:var(--f-display);font-size:15px;color:var(--ink)}
.daytabs button[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.daytabs button[aria-pressed="true"] b{color:var(--lamp-ink)}
.grid-scroll{overflow-x:auto}
.grid{display:grid;grid-template-columns:50px repeat(7,minmax(112px,1fr));min-width:840px}
.colhead{background:var(--panel);padding:10px 8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-width:0}
.colhead .dow{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.colhead .dn{font-family:var(--f-display);font-size:20px;line-height:1.1}
.colhead.today .dn{color:var(--lamp)}
.colhead .load{margin-top:6px;height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.colhead .load b{display:block;height:100%;background:var(--lamp)}
.colhead .loadtxt{font-size:11px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corner{border-bottom:1px solid var(--line)}
.hours{position:relative}
.hours span{position:absolute;right:6px;transform:translateY(-50%);font-size:10.5px;color:var(--ink-3)}
.day{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour))}
.day.past{background-color:color-mix(in srgb,var(--raised) 45%,transparent)}
.blk{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 8px 5px 10px;overflow:hidden;cursor:pointer;border:0;text-align:left;
  background:hsl(var(--h) var(--bs) var(--bl));color:hsl(var(--h) var(--bts) var(--btl));font-size:12px;line-height:1.28;display:flex;flex-direction:column;gap:1px}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:hsl(var(--h) var(--bbs) var(--bbl))}
.blk:hover{z-index:3;box-shadow:var(--shadow)}
.blk .t{font-weight:700;font-size:12.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
.blk.short{padding:2px 8px 2px 10px;justify-content:center;z-index:2}
.blk.short .t{-webkit-line-clamp:1;font-size:11.5px}
.blk.short.quiz::after{top:50%;transform:translateY(-50%);width:14px;height:14px;font-size:9px}
.blk .dots{display:flex;gap:3px;margin-top:2px}
.blk .dots i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.blk .dots i.d{opacity:1}
.blk.quiet{background:transparent;border:0;color:var(--ink-3);padding:1px 8px;justify-content:center;font-size:11px;cursor:default}
.blk.quiet::before{display:none}
.blk.quiet .t{font-weight:500;font-size:11px;display:flex;align-items:center;gap:6px;-webkit-line-clamp:1}
.blk.quiet .t::after{content:"";flex:1;border-top:1px dashed var(--line)}
.blk.quiet:hover{box-shadow:none}
.blk.quiz::after{content:"?";position:absolute;right:6px;top:4px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:hsl(var(--h) var(--bbs) var(--bbl));color:var(--bg)}
.blk .s{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .tm{font-family:var(--f-mono);font-size:10.5px;opacity:.75}
.blk.k-school{background:repeating-linear-gradient(135deg,transparent 0 7px,hsl(var(--h) var(--bs) calc(var(--bl) + 4%)) 7px 9px),hsl(var(--h) var(--bs) var(--bl))}
.blk.k-break,.blk.k-meal,.blk.k-rest{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}
.blk.k-break::before,.blk.k-meal::before,.blk.k-rest::before,.blk.k-free::before{display:none}
.blk.k-free{background:transparent;border:1px solid var(--line);color:var(--ink-3)}
.blk.k-free.prot{border-color:color-mix(in srgb,var(--mint) 50%,transparent);color:var(--mint)}
.blk.k-free .t{font-weight:500}

.blk.done{opacity:.5}
.blk.done .t::before{content:"✓ "}
.blk.gone{opacity:.4}
.blk.hl{outline:2px solid var(--lamp);outline-offset:1px;animation:pulse 1.2s ease-out 3}
@keyframes pulse{50%{outline-offset:5px}}
.due{position:absolute;left:0;width:12px;z-index:4;height:0;border-top:2px solid var(--rose);pointer-events:none}
.due::after{content:"";position:absolute;left:10px;top:-5px;border:4px solid transparent;border-left:6px solid var(--rose)}
.duechip{display:block;margin-top:4px;font-size:10.5px;font-weight:700;color:var(--rose);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duechip::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rose);margin-right:5px;vertical-align:1px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--lamp);z-index:5;pointer-events:none;box-shadow:0 0 12px 2px var(--lamp-glow)}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--lamp)}
@media (max-width:760px){
  .daytabs{display:flex}
  .grid{grid-template-columns:44px minmax(0,1fr);min-width:0}
  .grid .colhead:not(.active),.grid .day:not(.active){display:none}
  .blk{font-size:13px}
}

.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mdow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 6px}
.mcell{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:108px;padding:8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;min-width:0}
.mcell:hover{border-color:var(--ink-3)}
.mcell.out{opacity:.35}
.mcell.today{border-color:var(--lamp);box-shadow:inset 0 0 0 1px var(--lamp)}
.mcell .n{font-family:var(--f-display);font-size:14px}
.mcell .chip{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:hsl(var(--h) var(--bs) var(--bl));color:hsl(var(--h) var(--bts) var(--btl));border:0}
.mcell .chip.dl{background:var(--rose);color:var(--bg)}
.mcell .sl{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3)}
.mcell .sl b{display:block;height:4px;border-radius:2px;background:var(--lamp);opacity:.8}
@media (max-width:700px){.mcell{min-height:64px;padding:5px}.mcell .chip{font-size:0;height:6px;padding:0}.mcell .sl span{display:none}.month{gap:3px}}

.goals{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.goals{grid-template-columns:minmax(0,1fr)}}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.glist li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.glist li:first-child{border-top:0}
.ring{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c,var(--mint)) calc(var(--p)*1%),var(--raised) 0);grid-row:span 2}
.ring span{width:38px;height:38px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600}
.glist .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.glist .meta{font-size:12.5px;color:var(--ink-2);grid-column:2/-1}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.pill.ok{color:var(--mint)} .pill.warn{color:var(--lamp)} .pill.bad{color:var(--rose)} .pill.mute{color:var(--ink-3)}
.sugg{display:flex;flex-direction:column;gap:10px}
.sugg>div{border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sugg b{font-size:14px}
.sugg p{font-size:13px;color:var(--ink-2)}
.group-h{display:flex;justify-content:space-between;align-items:center;gap:8px}

.you{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.facts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px}
.facts li i{width:8px;height:8px;border-radius:50%;background:var(--lamp);margin-top:7px}
.facts li.off{opacity:.45}
.facts small{display:block;color:var(--ink-3);font-size:12px}
.insight{border-left:3px solid var(--sky);padding:4px 0 4px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;height:110px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--ink-3)}
.bars b{width:100%;max-width:40px;border-radius:6px 6px 2px 2px;background:var(--sky);min-height:3px}
.bars em{font-style:normal;font-family:var(--f-mono);color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--raised);border-radius:12px;padding:10px}
.stats b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.15}
.stats span{font-size:11.5px;color:var(--ink-2)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--ink-2);cursor:pointer;font-size:13.5px}
.drop.over{border-color:var(--lamp);background:var(--raised)}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.docs li{font-size:13px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.docs b{overflow-wrap:anywhere}

.ob{position:fixed;inset:0;z-index:50;background:radial-gradient(80% 60% at 50% 0%,var(--lamp-glow),transparent 70%),var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ob-in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-height:100%}
.ob-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.prog{flex:1;height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.prog b{display:block;height:100%;background:var(--lamp);transition:width .3s}
.ob-q{font-size:clamp(24px,4vw,34px)}
.ob-sub{color:var(--ink-2);max-width:60ch}
.echo{display:inline-flex;gap:8px;align-items:center;background:var(--raised);border-radius:999px;padding:6px 14px 6px 8px;font-size:14px;align-self:flex-start}
.echo i{width:8px;height:8px;border-radius:50%;background:var(--mint);margin-left:4px}
.ob-body{display:flex;flex-direction:column;gap:16px}
.ob-foot{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px}
.bigin{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-size:18px;width:100%}
.bigin:focus{outline:none;border-color:var(--lamp)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* ===== v10: Flo, sessions, progress, motion ===== */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
/* Flo */
.flo{--s:56px;width:var(--s);height:var(--s);display:inline-block;flex:0 0 auto;filter:drop-shadow(0 0 calc(var(--s) * .18) color-mix(in srgb,var(--lamp) 55%,transparent))}
.flo svg{width:100%;height:100%;overflow:visible;animation:flo-breathe 3.8s ease-in-out infinite}
.flo .f-body{fill:var(--lamp)}
.flo .f-shine{fill:#fff;opacity:.28}
.flo .f-halo{fill:none;stroke:var(--lamp);stroke-width:1.5;opacity:0}
.flo.lv5 .f-halo{opacity:.35;stroke-dasharray:3 5;animation:spin 18s linear infinite;transform-origin:32px 33px}
.flo .f-eyes{fill:var(--lamp-ink);transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.flo .f-joy,.flo .f-z,.flo .f-spark{display:none}
.flo .f-joy path,.flo .f-smile{fill:none;stroke:var(--lamp-ink);stroke-width:2.4;stroke-linecap:round}
.flo .f-z text{fill:var(--ink-3);font:700 9px var(--f-mono)}
.flo .f-spark{fill:var(--lamp)}
.flo.lv10 .f-spark{display:block;animation:twinkle 2.4s ease-in-out infinite}
.flo.m-happy svg{animation:flo-bounce .9s cubic-bezier(.3,1.6,.5,1) 2,flo-breathe 3.8s ease-in-out .9s infinite}
.flo.m-happy .f-eyes{display:none}.flo.m-happy .f-joy{display:block}.flo.m-happy .f-spark{display:block;animation:twinkle 1.6s ease-in-out infinite}
.flo.m-think svg{animation:flo-wobble 1.6s ease-in-out infinite}
.flo.m-think .f-eyes{transform:translate(2px,-2.5px);animation:none}
.flo.m-focus .f-eyes{transform:scaleY(.35);animation:none}
.flo.m-focus svg{animation:flo-breathe 6s ease-in-out infinite}
.flo.m-sleepy .f-body{opacity:.6}.flo.m-sleepy .f-eyes{transform:scaleY(.15);animation:none}.flo.m-sleepy .f-smile{opacity:.4}.flo.m-sleepy .f-z{display:block;animation:zz 3s ease-in-out infinite}
@keyframes flo-breathe{50%{transform:translateY(-2px) scale(1.035)}}
@keyframes flo-bounce{0%{transform:translateY(0)}35%{transform:translateY(-14%) scale(1.06,.96)}70%{transform:translateY(0) scale(.97,1.03)}100%{transform:none}}
@keyframes flo-wobble{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes twinkle{50%{opacity:.25;transform:scale(.8)}}
@keyframes zz{50%{opacity:.3;transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.teach{display:flex;flex-direction:column;gap:12px}.teach.center{align-items:center;text-align:center;padding:20px 0}
.teach .t-flo{display:flex;gap:12px;align-items:center}
.teach textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;line-height:1.5;resize:vertical;min-height:130px}
.teach textarea:focus{outline:2px solid var(--lamp);outline-offset:1px}
.t-res{display:flex;gap:16px;align-items:center}.t-res h2{font-size:19px;margin-top:4px}.t-res>div{display:flex;flex-direction:column;gap:2px}.t-res>div>svg,.t-res>div>span:first-child{display:none}
.tlist{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:12px 14px;background:var(--raised)}
.tlist span:not(.label){font-size:14px;padding-left:20px;position:relative}.tlist.ok span:not(.label)::before{content:"✓";position:absolute;left:0;color:var(--mint)}.tlist.gap span:not(.label)::before{content:"→";position:absolute;left:0;color:var(--lamp)}
.cheat{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:4px 16px;background:var(--raised);font-size:14px}
.cheat h2{font-size:15px;margin:14px 0 6px;font-family:var(--f-body);font-weight:700}
.sub-acts button:last-child:nth-child(odd){grid-column:1/-1}
.plus-tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:2px 7px;border-radius:999px;background:linear-gradient(135deg,var(--lamp),color-mix(in srgb,var(--lamp) 50%,#ff6aa2));color:#1a1206;vertical-align:middle;margin-left:4px}
.plusgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:10px}.no-mark .plusgrid{grid-template-columns:1fr}
.plusc{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:16px;color:var(--ink);background:radial-gradient(120% 160% at 100% 0%,var(--lamp-glow),transparent 60%),var(--panel);transition:transform .15s,border-color .2s}
.plusc:hover{transform:translateY(-2px);border-color:var(--lamp)}
.plusc i{grid-row:span 2;font-style:normal;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--raised);color:var(--lamp);font-size:18px}
.plusc b{font-size:15.5px}.plusc span{font-size:13px;color:var(--ink-3)}
@media(max-width:560px){.plusgrid{grid-template-columns:1fr}}
.mk,.ex{display:flex;flex-direction:column;gap:12px}
.mk .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mk-drop{border:1.5px dashed var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;transition:border-color .2s,background .2s}
.mk-drop.on{border-color:var(--lamp);background:var(--lamp-glow)}
.mk textarea,.ex textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;line-height:1.5;resize:vertical}
.mk-head .ring2 span{display:flex;align-items:baseline;justify-content:center;font-size:17px}.mk-head .ring2 span small{font-size:11px;margin-left:1px}
.mk-head{display:flex;gap:16px;align-items:center}.mk-head h2{font-size:20px;margin:4px 0}.mk-head small{font-size:.55em;color:var(--ink-3)}
.mk-pri{border-radius:16px;padding:14px 16px;background:radial-gradient(120% 160% at 0 0,var(--lamp-glow),transparent 70%),var(--raised);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mk-pri ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.mk-crit{display:flex;flex-direction:column;gap:6px}
.mk-crit details{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.mk-crit summary{display:grid;grid-template-columns:28px minmax(0,1fr) 90px 44px;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none;font-size:14px;font-weight:600}
.mk-crit summary::-webkit-details-marker{display:none}
.mk-crit summary i{font-style:normal;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--raised);color:var(--lamp);font-size:12px}
.mk-crit em{font-style:normal;font-family:var(--f-mono,monospace);font-size:13px;text-align:right}
.cbar{height:6px;border-radius:9px;background:var(--raised);overflow:hidden}.cbar b{display:block;height:100%;width:var(--w);background:var(--lamp);border-radius:9px}
.mk-crit details p,.mk-crit details ul{margin:0 12px 10px 50px;font-size:13.5px;color:var(--ink-2)}.mk-crit details ul{padding-left:16px}
.ex-q{border-radius:16px;padding:16px;background:var(--raised);position:relative}.ex-q p{margin:6px 0 0;font-size:16px;line-height:1.5;padding-right:40px}.ex-q b{position:absolute;right:14px;bottom:12px;font-family:var(--f-mono,monospace);color:var(--ink-3)}
.cmdterm{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--lamp)}
.ms{display:flex;flex-direction:column;gap:6px}.ms>div{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--raised)}
.ms i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}.ms .got i{background:color-mix(in srgb,var(--mint) 25%,transparent);color:var(--mint)}.ms .miss i{background:color-mix(in srgb,var(--rose) 22%,transparent);color:var(--rose)}
.ms span{display:flex;flex-direction:column;gap:2px;font-size:14px}.ms small{color:var(--ink-3);font-size:12.5px}
.model{border:1px solid var(--line);border-radius:14px;padding:10px 14px}.model summary{cursor:pointer;font-weight:700;font-size:14px}.model p{font-size:14px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.qprog b.indet{width:35%!important;animation:indet 1.4s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media(max-width:560px){.mk .fields{grid-template-columns:1fr}.mk-crit summary{grid-template-columns:28px minmax(0,1fr) 44px}.mk-crit .cbar{display:none}.mk-crit details p,.mk-crit details ul{margin-left:12px}}
/* navbar position (desktop) */
@media (min-width:861px){
  [data-dock="top"] .cmd{top:60px;bottom:auto!important;flex-direction:column-reverse;padding-top:2px;padding-bottom:0}
  [data-dock="top"] .plusmenu{bottom:auto;top:calc(100% + 8px)}
  [data-dock="top"] .view{padding-top:84px;padding-bottom:48px}
  [data-dock="top"] .toast{top:auto!important;bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}
  [data-dock="side"] .tabs{position:fixed;left:18px;top:50%;transform:translateY(-50%);flex-direction:column;border-radius:26px;padding:6px;gap:4px}
  [data-dock="side"] .tabs .navb{flex-direction:column;gap:5px;padding:11px 6px;font-size:11.5px;border-radius:20px;width:70px}
  [data-dock="side"] .tab-ind{border-radius:20px}
  [data-dock="side"] .view{padding-left:118px}
}
.dockpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dockpick button{border:1px solid var(--line);background:var(--raised);border-radius:14px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.dockpick button[aria-pressed="true"]{border-color:var(--lamp);color:var(--ink)}
.dockpick .mini{width:64px;height:42px;border-radius:8px;background:var(--panel);border:1px solid var(--line);position:relative}
.dockpick .mini i{position:absolute;background:var(--lamp);border-radius:4px}
.no-ai [data-act="marker"],.no-ai [data-act="exnew"],.no-ai [data-act="exhard"],.no-ai [data-act="teach"],.no-ai [data-act="cheat"],.no-ai [data-act="evequiz"],.no-ai [data-act="quizsubj"],.no-ai [data-act="subnotes"],.no-ai [data-plus="mark"],.no-ai .plus-tag{display:none!important}
.no-mark [data-act="marker"],.no-mark [data-plus="mark"],.no-mark [data-flo="mark"],.no-photo [data-plus="photo"],.no-photo [data-act="exphoto"]{display:none!important}
.flo-brief{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.bubble{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px 20px 20px 20px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.5}
.fchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchips button{border:1px solid color-mix(in srgb,var(--lamp) 40%,var(--line));background:color-mix(in srgb,var(--lamp) 8%,transparent);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .15s,background .15s}
.fchips button:hover{background:color-mix(in srgb,var(--lamp) 18%,transparent);transform:translateY(-1px)}
.fchips .spk{border:0;background:transparent;font-size:15px;padding:4px;opacity:.7}
.hero2{position:relative;overflow:hidden;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:10px;border:1px solid color-mix(in srgb,hsl(var(--h) 70% 60%) 35%,var(--line));background:radial-gradient(130% 160% at 100% 0%,color-mix(in srgb,hsl(var(--h) 80% 60%) 22%,transparent),transparent 55%),radial-gradient(120% 140% at 0% 100%,var(--lamp-glow),transparent 60%),var(--panel);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.hero2:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hero2::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 6s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes sheen{0%{transform:translateX(-100%)}30%,100%{transform:translateX(100%)}}
.hero2 .h-top{display:flex;gap:8px}
.hero2 .tag{font-family:var(--f-mono);font-size:12px;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,hsl(var(--h) 80% 60%) 20%,transparent);color:var(--ink)}
.hero2 .tag.ghost{background:var(--raised);color:var(--ink-2)}
.hero2 .what{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);line-height:1.1}
.hero2 .phase{color:var(--ink-2)}
.hero2 .h-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn.big{padding:13px 22px;font-size:15.5px}
.btn .play{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--lamp-ink) 18%,transparent);font-size:9px;margin-right:4px}
.dues{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.due-chip{position:relative;flex:0 0 auto;min-width:180px;max-width:240px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;scroll-snap-align:start;transition:transform .15s}
.due-chip:hover{transform:translateY(-2px)}
.due-chip b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-chip span{font-size:12.5px;color:var(--ink-3)}
.due-chip i{position:absolute;left:0;bottom:0;height:4px;width:calc(var(--p) * 1%);background:hsl(var(--h) var(--bbs) var(--bbl))}
.expill{border:1px solid color-mix(in srgb,var(--lamp) 50%,var(--line));background:var(--lamp-glow);color:var(--ink-2);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;margin-left:auto;margin-right:10px}
.expill b{color:var(--lamp)}
/* session */
.sess{overflow:auto}
.s-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:1px solid #3A3346;background:transparent;color:#C9C1D8;font-size:18px;cursor:pointer}
.s-in{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.s-top{display:flex;flex-direction:column;align-items:center;gap:10px}
.s-pick{display:flex;flex-direction:column;gap:4px;border:1px solid #3A3346;border-radius:18px;padding:16px 20px;background:rgba(255,255,255,.03);width:100%}
.s-pick b{font-family:var(--f-display);font-size:24px;color:#F2EEF8}
.s-pick span{color:#B8B0C8;font-size:14px}
.s-row{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.s-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.s-chips button{border:1px solid #3A3346;background:transparent;color:#C9C1D8;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13.5px;transition:all .15s}
.s-chips button:hover{border-color:#6A6080}
.s-chips button[aria-pressed="true"]{background:#F2EEF8;color:#0B0910;border-color:#F2EEF8}
.s-toggles{display:flex;flex-direction:column;gap:8px;width:100%}
.s-toggles label{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;border:1px solid #2E2838;border-radius:14px;padding:12px 14px;cursor:pointer;color:#E8E2F2}
.s-toggles input{width:18px;height:18px;accent-color:var(--lamp);margin-top:2px}
.s-toggles small{display:block;color:#8F879F;font-size:12.5px}
.s-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.s-input{width:100%;background:rgba(255,255,255,.05);border:1px solid #3A3346;border-radius:14px;padding:13px 16px;color:#F2EEF8;font-size:15px}
.s-input:focus{outline:none;border-color:var(--lamp)}
.s-goal{border:1px dashed color-mix(in srgb,var(--lamp) 60%,#3A3346);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;max-width:460px;min-height:56px;justify-content:center}
.s-goal b{color:#F2EEF8;font-size:16px}
.s-q{font-family:var(--f-body)!important;font-size:21px!important;line-height:1.35}
.s-opts{display:grid;gap:8px;width:100%}
.s-opts button{border:1px solid #3A3346;background:rgba(255,255,255,.03);color:#F2EEF8;border-radius:14px;padding:13px 16px;text-align:left;cursor:pointer;font-size:15px;transition:all .15s}
.s-opts button.right{border-color:#5FDFB4;background:rgba(95,223,180,.12)}
.s-opts button.wrong{border-color:#FF7D8C;background:rgba(255,125,140,.1)}
.s-rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.s-rate button{border:1px solid #3A3346;background:rgba(255,255,255,.03);color:#F2EEF8;border-radius:18px;padding:18px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,border-color .15s}
.s-rate button:hover{transform:translateY(-3px);border-color:var(--lamp)}
.s-rate i{font-style:normal;color:var(--lamp);font-size:18px}
.s-xp{font-family:var(--f-display);font-size:44px;color:var(--lamp);animation:pop-in .6s cubic-bezier(.3,1.6,.5,1) both}
.room .xp{width:100%;max-width:380px}
.room .muted{color:#A79FB7}
.quiet.nudge{color:var(--lamp)!important;animation:pop-in .4s both}
/* progress */
.xp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.xp .lv{font-family:var(--f-display);font-size:15px;background:var(--lamp);color:var(--lamp-ink);border-radius:10px;padding:4px 10px}
.xpbar{height:10px;border-radius:5px;background:var(--raised);overflow:hidden}
.xpbar b{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--lamp),color-mix(in srgb,var(--lamp) 60%,#fff));border-radius:5px;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.subj{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px;cursor:pointer;text-align:left;transition:transform .18s,border-color .18s}
.subj:hover{transform:translateY(-2px);border-color:hsl(var(--h) var(--bbs) var(--bbl))}
.sj{display:flex;flex-direction:column;gap:2px;min-width:0}
.sj b{font-size:15px}.sj b small{font-family:var(--f-mono);font-size:10.5px;background:var(--raised);border-radius:5px;padding:1px 5px;color:var(--ink-2)}
.sj span{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring2{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(hsl(var(--h) var(--bbs) var(--bbl)) calc(var(--p) * 1%),var(--raised) 0);animation:ring-fill 1.2s cubic-bezier(.2,.8,.2,1) both;flex:0 0 auto}
.ring2.big{width:76px;height:76px}
.ring2 span{width:78%;height:78%;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
@keyframes ring-fill{from{--p:0}}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.proj{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.proj span.muted{font-size:12.5px}
.pbar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.pbar i{display:block;height:100%;width:var(--w);background:hsl(var(--h) var(--bbs) var(--bbl));animation:grow 1s both}
.sub-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sub-acts button{border:1px solid var(--line);background:var(--raised);border-radius:16px;padding:14px;cursor:pointer;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;transition:transform .15s}
.sub-acts button:hover{transform:translateY(-2px)}
.sub-acts i{font-style:normal;grid-row:span 2;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--panel);color:var(--lamp)}
.sub-acts small{color:var(--ink-3);font-size:12px}
.voices{display:grid;gap:8px}
.voices button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.voices button[aria-pressed="true"]{border-color:var(--lamp);box-shadow:inset 0 0 0 1px var(--lamp)}
.voices i{font-style:normal;color:var(--ink-2);font-size:13.5px}
/* motion */
.tabs{position:relative}
.tab-ind{position:absolute;border-radius:999px;background:var(--ink);transition:left .4s cubic-bezier(.3,1.25,.5,1),width .4s cubic-bezier(.3,1.25,.5,1),top .4s,height .4s;z-index:0;pointer-events:none}
.tabs .navb{position:relative;z-index:1;background:transparent!important;transition:color .25s}
.tabs .navb[aria-current="page"]{color:var(--bg)}
.btn,.navb,.dchip,.chip{transition:transform .12s ease,background .2s,border-color .2s,color .2s}
.btn:active,.dchip:active,.fchips button:active,.s-chips button:active{transform:scale(.95)}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.scrim{animation:fade .2s ease both}
.modal{animation:modal-in .32s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes modal-in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
.drawer{animation:drawer-in .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes drawer-in{from{transform:translateX(40px);opacity:0}}
.sheet:not([hidden]),.pop:not([hidden]),.plusmenu:not([hidden]){animation:sheet-in .28s cubic-bezier(.2,.9,.3,1.1) both;transform-origin:bottom center}
@keyframes sheet-in{from{opacity:0;transform:translateY(10px) scale(.98)}}
.toast{animation:toast-in .4s cubic-bezier(.3,1.4,.5,1) both}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}to{transform:translate(-50%,0)}}
.room{animation:fade .35s ease both}
.timeline li button{transition:background .15s,transform .15s}
.timeline li button:hover{transform:translateX(3px)}
.topbar{view-transition-name:topbar}
.cmd{view-transition-name:dock}
#view{view-transition-name:page}
::view-transition-old(page){animation:vt-out .22s ease both}
::view-transition-new(page){animation:vt-in .42s cubic-bezier(.2,.8,.2,1) both}
html[data-dir="back"]::view-transition-old(page){animation-name:vt-out-back}
html[data-dir="back"]::view-transition-new(page){animation-name:vt-in-back}
@keyframes vt-out{to{opacity:0;transform:translateX(-24px)}}
@keyframes vt-in{from{opacity:0;transform:translateX(36px)}}
@keyframes vt-out-back{to{opacity:0;transform:translateX(24px)}}
@keyframes vt-in-back{from{opacity:0;transform:translateX(-36px)}}
::view-transition-old(root),::view-transition-new(root){animation:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";
/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addDs = (s, n) => ds(addDays(pd(s), n));
const tm = s => { if (!s) return null; const [h,m] = String(s).split(":").map(Number); return h*60 + (m||0); };
const fmt = min => { min = Math.round(min); let h = Math.floor(min/60) % 24, m = min % 60; const ap = h < 12 ? "am" : "pm"; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const fmtS = min => fmt(min).replace(":00", "");
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEK = [1,2,3,4,5,6,0];
const uid = () => Math.random().toString(36).slice(2, 9);
const hrs = m => { const h = m/60; return (Math.round(h*10)/10).toString().replace(/\.0$/, "") + "h"; };
const nowMin = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const todayStr = () => ds(new Date());
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const mondayOf = s => { const d = pd(s); return addDs(s, -((d.getDay() + 6) % 7)); };
const nice = s => { const d = pd(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const rel = s => { const n = daysBetween(todayStr(), s); return n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "yesterday" : n > 1 && n < 7 ? DOWL[pd(s).getDay()] : nice(s); };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const daypart = m => m < 720 ? "morning" : m < 1020 ? "afternoon" : m < 1260 ? "evening" : "night";
const listJoin = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length-1];
function hueFor(subject){
  const s = (subject || "general").toLowerCase();
  const fixed = [["math",255],["chem",160],["phys",195],["bio",120],["english",20],["lit",20],["arab",38],["span",8],["french",330],["hist",48],["geo",85],["econ",300],["business",280],["psych",215],["computer",185],["sat",58],["act",58],["ielts",58],["extended essay",28],["tok",268],["cas",95],["applications",230],["art",350]];
  for (const [k,h] of fixed) if (s.includes(k)) return h;
  let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) % 360; return h;
}

/* ================= knowledge base used for inference ================= */
const CURRICULA = {
  ibdp:{name:"IB Diploma", short:"IB DP", subjects:["Math AA","Math AI","English A Lang & Lit","English A Literature","Arabic A","Arabic B","Spanish B","French B","Hindi B","Economics","Business Management","Psychology","History","Geography","Global Politics","Biology","Chemistry","Physics","Computer Science","ESS","Visual Arts","Theatre","Music"], tests:["SAT","ACT","IELTS / TOEFL"], unit:"subjects"},
  alevel:{name:"A-Levels", short:"A-Level", subjects:["Maths","Further Maths","Physics","Chemistry","Biology","Economics","Business","Psychology","English Literature","History","Geography","Computer Science","Sociology","Art"], tests:["UCAT","LNAT","IELTS / TOEFL","SAT"], unit:"subjects"},
  igcse:{name:"IGCSE / GCSE", short:"IGCSE", subjects:["Maths","Additional Maths","English Language","English Literature","Physics","Chemistry","Biology","Combined Science","Business","Economics","Computer Science","ICT","Arabic","French","Spanish","History","Geography","Art"], tests:["IELTS / TOEFL"], unit:"subjects"},
  ap:{name:"US High School / AP", short:"AP", subjects:["AP Calculus AB","AP Calculus BC","AP Statistics","AP Physics 1","AP Chemistry","AP Biology","AP Computer Science A","AP English Language","AP English Literature","AP US History","AP World History","AP Psychology","AP Macroeconomics","AP Microeconomics","Honors Math","Honors English","Spanish","French"], tests:["SAT","ACT","IELTS / TOEFL"], unit:"courses"},
  cbse:{name:"CBSE / ICSE", short:"CBSE", subjects:["Physics","Chemistry","Mathematics","Biology","English","Computer Science","Economics","Accountancy","Business Studies","Hindi","Physical Education"], tests:["JEE","NEET","CUET","SAT"], unit:"subjects"},
  middle:{name:"Middle school", short:"Middle", subjects:["Maths","English","Science","Arabic","French","Spanish","Individuals & Societies","History","Geography","Design","Computer Science","Art","Music","PE"], tests:[], unit:"subjects"},
  uni:{name:"University", short:"Uni", subjects:[], tests:["GRE / GMAT","IELTS / TOEFL"], unit:"modules"},
  work:{name:"Working and studying", short:"Work", subjects:[], tests:["Certification exam"], unit:"courses"},
  other:{name:"Self-paced learning", short:"Study", subjects:[], tests:[], unit:"topics"}
};
function detectCurriculum(text){
  const t = " " + text.toLowerCase() + " ";
  const y13 = /(year|yr|y)\s*13|grade\s*12|\bg12\b/.test(t), y12 = /(year|yr|y)\s*12|grade\s*11|\bg11\b/.test(t);
  if (/\bdp\s*-?\s*1\b|\bib\b.*(year\s*1\b|\by1\b|first|grade\s*11)|diploma.*(\b1\b|first)/.test(t)) return {c:"ibdp", year:1};
  if (/\bdp\s*-?\s*2\b|\bib\b.*(year\s*2\b|\by2\b|second|grade\s*12)|diploma.*(\b2\b|second)/.test(t)) return {c:"ibdp", year:2};
  if (/\bib\b|baccalaureate|diploma programme|\bibdp\b/.test(t)) return {c:"ibdp", year:y13 ? 2 : 1};
  if (/a[\s-]?levels?|\bas[\s-]level|sixth form/.test(t)) return {c:"alevel", year:y13 ? 2 : 1};
  if (/\bmyp\s*[1-3]\b|grade\s*[6-8]\b|year\s*[7-9]\b|\bks3\b|middle school/.test(t)) return {c:"middle", year:1};
  if (/igcse|\bgcse|year\s*1[01]\b|\bmyp\b|grade\s*(9|10)\b/.test(t)) return {c:"igcse", year:/11/.test(t) ? 2 : 1};
  if (/\bcbse|\bicse|\bisc\b|class\s*1[0-2]/.test(t)) return {c:"cbse", year:/12/.test(t) ? 2 : 1};
  if (/\bap\b|high school|grade\s*(11|12)|junior|sophomore|senior/.test(t)) return {c:"ap", year:/12|senior/.test(t) ? 2 : 1};
  if (/uni|college|degree|bachelor|master|\bbsc\b|\bba\b|\bmba\b|phd|semester/.test(t)) return {c:"uni", year:1};
  if (/work|job|certif|\bcfa\b|\bacca\b|\bcpa\b|career/.test(t)) return {c:"work", year:1};
  if (y12) return {c:"alevel", year:1};
  if (y13) return {c:"alevel", year:2};
  return null;
}
function yearLabel(p){
  const c = p.curriculum;
  if (c === "ibdp") return `DP${p.year}`;
  if (c === "alevel") return p.year === 2 ? "Year 13" : "Year 12";
  if (c === "igcse") return p.year === 2 ? "Year 11" : "Year 10";
  if (c === "cbse") return p.year === 2 ? "Class 12" : "Class 11";
  if (c === "ap") return p.year === 2 ? "Senior year" : "Junior year";
  if (c === "middle") return "Middle school";
  if (c === "uni") return ["","1st year","2nd year","Final year","Postgrad"][p.year] || "University";
  if (c === "work") return "Working";
  return CURRICULA[c]?.name || "";
}
const ACTIVITIES = [["sport","Sport / team practice"],["gym","Gym or running"],["music","Music lessons"],["mun","MUN or debate"],["service","Volunteering / service"],["arts","Art, drama or dance"],["tutor","Tuition / tutoring"],["job","Part-time job"],["coding","Coding or robotics"],["faith","Religious classes"]];
const PEAKS = {morning:[360,720,"Morning"], afternoon:[720,1020,"Afternoon"], evening:[1020,1260,"Evening"], night:[1200,1440,"Late night"]};
const TYPE_HOURS = {exam:8, test:5, quiz:2, mock:3, project:6, assignment:3, essay:3, homework:1, presentation:3, ia:6, prep:2, review:.25, other:2};
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } })();
const IN_UAE = /Dubai|Abu_Dhabi/.test(TZ);

/* ================= state ================= */
let state;
function blankDraft(){
  return {name:"", studyText:"", curriculum:null, year:1, subjects:[], hard:[], tests:[], testMonth:{}, ee:"none", eeSubject:"", focus:"balanced", acts:{}, wake:"06:30", sleep:"22:30", schoolDays:[1,2,3,4,5], schoolStart:"07:30", schoolEnd: IN_UAE ? "14:30" : "15:00", shortFri: IN_UAE, friEnd:"11:30", peak:"evening", focusLen:45, maxStudy:null, weekendMax:null, coming:"", comingRows:[], flags:{}, voice:"coach", grades:{}, degree:"", thesis:"", examMonth:"", goal:{title:"", month:"", hpw:5}};
}
const storeKey = () => "studyflow.v2:" + (window.AUTH?.user?.id || "guest");
function save(){ const j = JSON.stringify(state); try { localStorage.setItem(storeKey(), j); } catch (e) {} window.AUTH?.queueSave(j); }
function normalize(){ state.ext = state.ext || {}; (state.chats || []).forEach(c => { if (c.status === "running") c.status = "interrupted"; }); }
function load(){
  try { const raw = localStorage.getItem(storeKey()); if (raw) { state = JSON.parse(raw); state.ext = state.ext || {}; (state.chats || []).forEach(c => { if (c.status === "running") c.status = "interrupted"; }); return; } } catch (e) {}
  state = exampleState();
}

/* ---------- inference: profile -> plan settings, auto goals, explanations ---------- */
function suggestedHours(d){
  const base = {ibdp:2.5, alevel:2.5, igcse:2, ap:2, cbse:3, middle:1, uni:3, work:1.5, other:2}[d.curriculum || "other"];
  const f = d.focus === "academics" ? .5 : d.focus === "activities" ? -.5 : 0;
  const finalYear = ["ibdp","alevel","cbse"].includes(d.curriculum) && d.year === 2 ? .5 : 0;
  return {weekday: Math.max(1, base + f + finalYear), weekend: Math.max(1.5, base + f + finalYear + 1.5)};
}
const GRADE_SCALES = {ibdp:["1","2","3","4","5","6","7"], alevel:["E","D","C","B","A","A*"], igcse:["3","4","5","6","7","8","9"], ap:["1","2","3","4","5"], cbse:["<60%","60s","70s","80s","90s"], middle:["D","C","B","A","A*"]};
function gradeGap(d, name){ const g = d.grades?.[name], sc = GRADE_SCALES[d.curriculum]; if (!g || !sc || !g.now || !g.target) return 0; return Math.max(0, sc.indexOf(g.target) - sc.indexOf(g.now)); }
function firstSaturday(ym){ const [y,m] = ym.split("-").map(Number); const d = new Date(y, m-1, 1); while (d.getDay() !== 6) d.setDate(d.getDate()+1); return ds(d); }
function upcomingMonths(n){ const out = [], t = new Date(); for (let i = 1; i <= n; i++) { const d = new Date(t.getFullYear(), t.getMonth()+i, 1); out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); } return out; }
function inferences(d){
  const out = [], C = CURRICULA[d.curriculum] || CURRICULA.other, sh = suggestedHours(d);
  const subj = d.subjects.map(s => s.name);
  if (subj.length) out.push({key:"routines", text:`Steady weekly review for ${subj.length === 1 ? "your " + C.unit.replace(/s$/, "") : `all ${subj.length} ${C.unit}`}${d.curriculum === "ibdp" ? ", with more time for HL" : ""}.`, why:`So nothing piles up before tests. It fills study time that deadlines don't need.`});
  if (d.hard.length) out.push({key:"hardBoost", text:`Extra time for ${listJoin(d.hard)}, placed in your ${PEAKS[d.peak][2].toLowerCase()} focus window.`, why:`You said these feel hardest, so they get about 40% more review and your sharpest hours.`});
  const gaps = d.subjects.map(s => [s.name, gradeGap(d, s.name)]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]);
  if (gaps.length) out.push({key:"grades", text:`More time where the gap to your target is biggest: ${gaps.slice(0,3).map(([n,g]) => `${n} (${d.grades[n].now} → ${d.grades[n].target})`).join(", ")}.`, why:`Each grade of gap adds about 15% more weekly review, so effort goes where it moves your results most.`});
  if (d.curriculum === "uni" && d.thesis) out.push({key:"thesis", text:`Your ${d.year >= 3 ? "dissertation" : "project"} broken into milestones up to ${MONL[+d.thesis.slice(5)-1]}.`, why:`Long projects slip when they're one big deadline. Small monthly milestones keep them moving.`});

function learn(){
  const parts = {morning:{d:0,s:0}, afternoon:{d:0,s:0}, evening:{d:0,s:0}, night:{d:0,s:0}};
  state.log.filter(l => l.kind === "study").forEach(l => parts[daypart(l.start)].d++);
  state.skips.filter(s => s.kind === "study" && s.reason !== "tired").forEach(s => parts[daypart(s.start)].s++);
  const weak = new Set(); let best = null, bestRate = -1;
  for (const [k, v] of Object.entries(parts)) {

const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
const icsDT = (date, min) => date.replace(/-/g, "") + "T" + pad(Math.floor(min/60)) + pad(min % 60) + "00";
function buildICS(){
  const t0 = todayStr(), stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//StudyFlow//Plan//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:StudyFlow"];
  for (let i = 0; i < 28; i++) {
    const d = addDs(t0, i);
    displayBlocks(d).filter(b => b.kind === "study" && !b.parts.every(p => p.done || p.gone)).forEach(b => {
      L.push("BEGIN:VEVENT", `UID:${String(b.key || b.title).replace(/[^\w-]/g, "")}-${d}-${b.start}@studyflow`, `DTSTAMP:${stamp}`, `DTSTART:${icsDT(d, b.start)}`, `DTEND:${icsDT(d, b.end)}`, `SUMMARY:${icsEsc((b.quiz ? "Quiz: " : "") + b.title)}`, `DESCRIPTION:${icsEsc((b.phase || "") + (b.parts.length > 1 ? ` (${b.parts.length} sessions with short breaks)` : "") + "\nPlanned by StudyFlow")}`, "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(b.title)}`, "TRIGGER:-PT10M", "END:VALARM", "END:VEVENT");
    });
    dueOn(d).forEach(t => { const m = cutMin(t); L.push("BEGIN:VEVENT", `UID:due-${t.id}@studyflow`, `DTSTAMP:${stamp}`, `DTSTART:${icsDT(d, m)}`, `DTEND:${icsDT(d, Math.min(1439, m + 15))}`, `SUMMARY:${icsEsc("Due: " + t.title)}`, "END:VEVENT"); });

}

/* ---------- focus room: full screen, calm sounds ---------- */
let audioCtx = null, noiseNode = null;
function stopAmbient(){ try { noiseNode?.stop(); } catch (e) {} noiseNode = null; }
function playAmbient(kind){
  stopAmbient(); if (kind === "off") return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const len = audioCtx.sampleRate * 4, buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); let last = 0, b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1;
        if (kind === "brown") { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
        else { b0 = 0.99765 * b0 + w * 0.099; b1 = 0.963 * b1 + w * 0.2965; b2 = 0.57 * b2 + w * 1.0527; d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.06; } } }
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = kind === "rain" ? 2600 : 900;
    const g = audioCtx.createGain(); g.gain.value = 0.35;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start(); noiseNode = src;
  } catch (e) {}
}

}

/* ---------- grade forecast ---------- */
function forecast(subject){
  const P = state.profile, sc = GRADE_SCALES[P.curriculum], g = P.draft?.grades?.[subject] || {}, m = mastery(subject);
  if (!sc) return m == null ? null : {pct:m};
  const iNow = g.now ? sc.indexOf(g.now) : -1, iT = g.target ? sc.indexOf(g.target) : -1;
  const iM = m == null ? -1 : Math.max(0, Math.min(sc.length - 1, Math.round((m / 100) * (sc.length - 1) + .2)));
  const w = .5 * Math.min(1, quizzes().filter(q => q.subject === subject).length / 5);
  const i = iNow >= 0 && iM >= 0 ? Math.round(iNow * (1 - w) + iM * w) : iNow >= 0 ? iNow : iM;
  if (i < 0) return null;
  return {now:g.now || null, pred:sc[i], target:g.target || null, gap:iT >= 0 ? iT - i : 0, m};
}

function parseICSDate(v, params){

async function readFile(file){

  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
    if (!window.pdfjsLib) throw new Error("pdf");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    let out = "";
    for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) { const p = await pdf.getPage(i); const c = await p.getTextContent(); out += c.items.map(x => x.str).join(" ") + "\n"; if (out.length > 40000) break; }
    return {text: out};
  }
  if (/\.docx$/i.test(file.name) && window.JSZip) {
    const z = await JSZip.loadAsync(await file.arrayBuffer()), x = await z.file("word/document.xml")?.async("string") || "";

  return {text: await file.text()};
}

  } catch (e) { if (!QZ) return; QZ.loading = false; QZ.error = aiErr(e); drawQuiz(); }
}
function drawQuiz(){
  if (!QZ) return; const Q = QZ;
  if (Q.loading) return showModal(`<div class="label">Quiz · ${esc(Q.subject)}</div><h2>Writing your quiz…</h2><p class="muted">5 questions${Q.topic ? ` on ${esc(Q.topic)}` : ""}, matched to how you've been doing.</p><div class="qprog"><b style="width:15%"></b></div><div class="row"><button class="btn ghost" data-act="close">Cancel</button></div>`);
  if (Q.error) return showModal(`<div class="label">Quiz · ${esc(Q.subject)}</div><h2>Couldn't make the quiz</h2><p class="muted">${esc(Q.error)}</p><div class="row"><button class="btn primary" data-act="quizsubj" data-v="${esc(Q.subject)}" data-t="${esc(Q.topic)}">Try again</button><button class="btn ghost" data-act="close">Close</button></div>`);
  if (Q.i >= Q.items.length) {
    const pct = Math.round(Q.score / Q.items.length * 100), m = mastery(Q.subject);
    return showModal(`<div class="label">Quiz · ${esc(Q.subject)}</div><div class="qscore">${Q.score}/${Q.items.length}</div>
      <h2>${pct >= 80 ? "Strong work." : pct >= 60 ? "Getting there." : "Good to find this now."}</h2>
      <p class="muted">${esc(Q.subject)} is now at ${m}%. ${m < 60 ? "I've added extra review time this week." : m > 85 ? "I've eased off review time a little." : "Your plan stays on track."}${Q.missed.length ? ` The ${Q.missed.length} you missed went into your mistake bank and will come back later.` : ""}</p>
      <div class="row">${Q.missed.length && sampleFn ? `<button class="btn primary" data-act="qexplain">Explain my mistakes</button>` : ""}<button class="btn ${Q.missed.length ? "" : "primary"}" data-act="close">Done</button></div>`);
  }
  const it = Q.items[Q.i], ans = Q.picked != null;
  showModal(`<div class="row" style="justify-content:space-between"><span class="label">Quiz · ${esc(Q.subject)}${it.fromBank ? " · from your mistake bank" : ""}</span><span class="label mono">${Q.i + 1}/${Q.items.length}</span></div>
    <div class="qprog"><b style="width:${(Q.i + (ans ? 1 : 0)) / Q.items.length * 100}%"></b></div>
    <h2 style="font-family:var(--f-body);font-size:19px;line-height:1.35">${esc(it.q)}</h2>
    <div class="qopts">${it.options.map((o, k) => `<button data-act="qans" data-v="${k}" ${ans ? "disabled" : ""} class="${ans && k === it.answer ? "right" : ans && k === Q.picked ? "wrong" : ""}"><i>${"ABCD"[k]}</i><span>${esc(o)}</span></button>`).join("")}</div>
    ${ans ? `<div class="qwhy"><b>${Q.picked === it.answer ? "Correct." : "Not quite."}</b> ${esc(it.why)}</div><div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="qnext">${Q.i + 1 === Q.items.length ? "See results" : "Next"}</button></div>` : `<div class="row"><button class="btn ghost small" data-act="close">Stop quiz</button></div>`}`);
}
function quizAnswer(k){
  const Q = QZ; if (!Q || Q.picked != null) return; const it = Q.items[Q.i]; Q.picked = k;
  const bank = mistakes(), at = bank.findIndex(m => m.q === it.q && m.subject === Q.subject);
  if (k === it.answer) { Q.score++; if (at >= 0) bank.splice(at, 1); }
  else { addMistakeCard(it, Q.subject); Q.missed.push(it); if (at < 0) bank.push({subject:Q.subject, q:it.q, options:it.options, answer:it.answer, why:it.why, topic:it.topic}); }
  const per = bank.filter(m => m.subject === Q.subject); if (per.length > 20) bank.splice(bank.indexOf(per[0]), 1);
  drawQuiz();
}
function quizNext(){
  const Q = QZ; if (!Q) return; Q.i++; Q.picked = null;
  if (Q.i >= Q.items.length) {
    addXP(Q.score * 3 + 3); setTimeout(checkBadges, 600); track("quiz_done"); quizzes().push({id:uid(), subject:Q.subject, topic:Q.topic, date:todayStr(), score:Q.score, total:Q.items.length});
    if (Q.block && !Q.block.done) logDone(Q.block);
    render();
  }
  drawQuiz();
}

  if (act === "qexplain") { const m = QZ?.missed || []; const subj = QZ?.subject; closeOverlay(); return openDrawer({title:`${subj} quiz mistakes`, subject:subj, kickoff:`I just did a ${subj} quiz and got these wrong. Explain each one simply and give me a memory trick:\n\n` + m.map((x, i) => `${i+1}. ${x.q}\nCorrect answer: ${x.options[x.answer]}`).join("\n\n")}); }
  if (act === "add") return openTaskForm(null);
  if (act === "edit") return openTaskForm(a.dataset.task);
  if (act === "deltask") { const s = snap(); state.tasks = state.tasks.filter(t => t.id !== a.dataset.task); closeOverlay(); render(); toast("Deleted. Your plan has been updated.", s); return; }
  if (act === "rescue") return rescue(a.dataset.task);
  if (act === "fix") { const s = snap(), t = state.tasks.find(x => x.id === a.dataset.task), sf = PLAN.shortfall[t.id];
    if (a.dataset.v === "boost") t.boost = true; if (a.dataset.v === "sat") state.profile.flags.satFree = false; if (a.dataset.v === "trim") t.hours = Math.max(.5, Math.floor((taskHours(t) - sf/60) * 2) / 2);
    closeOverlay(); render(); const after = PLAN.shortfall[t.id] || 0; toast(after > 10 ? `Better, but still ${hrs(after)} short. Try another fix.` : `${t.title} now fits.`, s); return; }
  if (act === "sugg") { const s = snap(), sg = suggestions().find(x => x.id === a.dataset.v); if (!sg) return; const before = new Set(PLAN.blocks.map(b => b.id)); state.tasks.push({doneMin:0, dueTime:"21:00", ...sg.task}); PLAN = plan(); const extra = prepSummary(before, new Set([sg.task.id])); render(); toast(`Added.${extra}`, s); return; }
  if (act === "suggx") { state.suggestionsDismissed.push(a.dataset.v); return render(); }
  if (act === "peak") { const s = snap(); state.profile.peak = a.dataset.v; state.profile.draft.peak = a.dataset.v; render(); toast(`Hard subjects now go in the ${a.dataset.v}.`, s); return; }
  if (act === "saveSettings") { const s = snap(), P = state.profile; P.maxStudy = Number($("#s-max").value) || P.maxStudy; P.weekendMax = Number($("#s-wmax").value); P.peak = $("#s-peak").value; P.focusLen = Number($("#s-len").value); Object.assign(P.draft, {maxStudy:P.maxStudy, weekendMax:P.weekendMax, peak:P.peak, focusLen:P.focusLen}); closeOverlay(); render(); toast("Saved. Your plan has been updated.", s); return; }
  if (act === "account") return showModal(accountCard() + `<div class="row"><button class="btn ghost" data-act="close">Close</button></div>`);
  if (act === "signout") return window.AUTH?.signOut();

  if (act === "delacct") return showModal(`<div class="label">Delete account</div><h2>Delete your account?</h2><p class="muted">This permanently deletes your plan, quizzes, flashcards, chats, linked calendars and uploaded notes. It can't be undone.</p><div class="row"><button class="btn" data-act="close">Keep my account</button><button class="btn primary" data-act="delacct2" style="background:var(--rose);border-color:var(--rose)">Delete permanently</button></div>`);
  if (act === "delacct2") { a.disabled = true; a.textContent = "Deleting…"; return window.AUTH.deleteAccount().catch(() => { closeOverlay(); toast("Couldn't delete your account. Try again, or contact support."); }); }
  if (act === "google") return showModal(`<div class="label">Google</div><h2>One-tap Google sync is coming</h2><p class="muted">Until Google approves StudyFlow, you can already keep Google Calendar in sync: paste its secret iCal link and it updates every 30 minutes.</p><div class="row"><button class="btn primary" data-feed="open">Link a calendar</button><button class="btn ghost" data-act="close">Close</button></div>`);
  if (act === "importsrc") { importTarget = a.dataset.v || null; $("#fileInput").click(); return; }
  if (act === "disconnect") { const s = snap(), k = a.dataset.v; delete state.ext[k]; state.tasks = state.tasks.filter(t => t.ext !== k); render(); toast("Removed. Your plan has been updated.", s); return; }
  if (act === "pasteimport") { const v = $("#pasteIn").value.trim(); if (!v) return toast("Paste something first."); return quickAdd(v, true); }
  if (act === "reminders") {
    const t0 = todayStr();

      : state.tasks.filter(t => t.due >= t0 && t.due <= addDs(t0, 7) && dueOn(t.due).includes(t)).sort((x,y) => x.due.localeCompare(y.due)).map(t => `${t.title} (due ${nice(t.due)})`);
    if (!lines.length) return toast(a.dataset.v === "today" ? "No study sessions left today." : "No deadlines in the next 7 days.");
    return copyText(lines.join("\n"));
  }
  if (act === "theme") return toggleTheme();
  if (act === "fpause") { if (FOCUS) { FOCUS.running = !FOCUS.running; paintFocus(); updatePresence(); } return; }
  if (act === "badges") return openBadges();

  if (act === "joinfocus") return joinFocus();
  if (act === "report") return openReport();

  if (act === "appearance") return openAppearance();

  if (act === "fmin") { $("#overlay").innerHTML = ""; exitFS(); paintFocus(); return; }
  if (act === "fcflip") { if (FC) { FC.flip = !FC.flip; drawCard(); } return; }
  if (act === "fcrate") return rateCard(+a.dataset.v);
  if (act === "cards") return reviewCards(a.dataset.v || "");
  if (act === "cardsrev") return reviewCards(a.dataset.v || "");
  if (act === "cardsmake") return makeCards(a.dataset.v, "");
  if (act === "cardshub") return openCardsHub();
  if (act === "tour") return startTour();
  if (act === "settings") return openSettings();
  if (act === "actions") return openActions();
  if (act === "wrap") return openWrap();
  if (act === "wrapsave") return saveWrap();
  if (act === "recapx") { (state.recapSeen = state.recapSeen || []).push(a.dataset.v); return render(); }
  if (act === "flag") { const s0 = snap(), P = state.profile, k = a.dataset.v, on = P.flags[k] !== false; P.draft.flags = P.draft.flags || {}; P.draft.flags[k] = !on; finalize(P.draft, true); render(); toast(`${FLAG_LABEL(k)} turned ${on ? "off" : "on"}. Your plan has been updated.`, s0); return; }
});
let dragDepth = 0;
document.addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { dragDepth++; $("#dropzone").hidden = false; } });
document.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#dropzone").hidden = true; });
document.addEventListener("dragover", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) e.preventDefault(); });
document.addEventListener("drop", e => { dragDepth = 0; $("#dropzone").hidden = true; if (e.dataTransfer?.files?.length) { e.preventDefault(); addAttachments(e.dataTransfer.files); } });
document.addEventListener("paste", e => { if (e.target.id !== "cmdIn") return; const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); addAttachments(fs); } });
document.addEventListener("drop.legacy", e => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); handleFiles([...e.dataTransfer.files]); } });
$("#snapInput").onchange = e => { const t = e.target; if (t.dataset.attach) { delete t.dataset.attach; addAttachments(t.files); } else handleFiles([...t.files]); t.value = ""; };
$("#fileInput").addEventListener("change", e => { const t = e.target; if (t.dataset.attach && t.files.length) { delete t.dataset.attach; addAttachments(t.files); t.value = ""; e.stopImmediatePropagation(); } }, true);
$("#fileInput").onchange = e => { handleFiles([...e.target.files]).finally(() => { importTarget = null; }); e.target.value = ""; };

try { const th = localStorage.getItem("studyflow.theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
applyLook();
// Started by src/auth.js once we know who is signed in.
window.SF_boot = (remote, opts = {}) => {
  if (remote && remote.profile) { state = remote; normalize(); } else load();
  sampleFn = window.AUTH?.user && window.STUDYFLOW_CONFIG?.aiEnabled ? window.__sfSample : null; document.documentElement.classList.toggle("no-ai", !sampleFn); document.documentElement.classList.toggle("no-mark", !window.STUDYFLOW_CONFIG?.markingEnabled); document.documentElement.classList.toggle("no-photo", !window.STUDYFLOW_CONFIG?.photosEnabled);
  track("open"); activeDay = ACTIVE_DAY_INIT(); render();
  if (!window.__sfTick) window.__sfTick = setInterval(() => { if (!$("#overlay").innerHTML && !document.activeElement?.closest?.("input,textarea,select")) render(); }, 60000);
  if (opts.isNew) { window.__sfName = opts.name || ""; openOnboarding(); }
  window.dispatchEvent(new Event("sf:booted"));
};
// Called when the same account changed on another device.
window.SF_replaceState = s => { if (!s || !s.profile) return; state = s; normalize(); if (!$("#overlay").innerHTML) render(); toast("Updated with changes from your other device."); };
